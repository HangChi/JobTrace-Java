openapi: 3.1.0
info:
  title: Account email binding code
  version: 017
paths:
  /api/profile/email/code:
    post:
      operationId: requestAccountEmailBindingCode
      security:
        - jobTraceBridge: []
      parameters:
        - in: header
          name: X-JobTrace-Session-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Code accepted for delivery
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Invalid address
        '409':
          description: Address belongs to another account
        '422':
          description: Invalid recipient
        '429':
          description: Rate limit exceeded
        '502':
          description: Delivery rejected
        '503':
          description: Delivery or signing unavailable
components:
  securitySchemes:
    jobTraceBridge:
      type: http
      scheme: bearer
      bearerFormat: JobTraceBridge
