openapi: 3.1.0
info:
  title: Registration email code request
  version: 018
paths:
  /api/auth/email-code:
    post:
      operationId: requestRegistrationEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Code accepted for delivery
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          description: Invalid address
        '403':
          description: Cross-site request
        '409':
          description: Address already in use
        '422':
          description: Invalid recipient
        '429':
          description: Rate limit exceeded
        '502':
          description: Delivery rejected
        '503':
          description: Delivery or signing unavailable
