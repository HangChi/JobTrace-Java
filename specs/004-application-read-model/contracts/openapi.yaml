openapi: 3.1.0
info:
  title: JobTrace Application Read Model API
  version: 0.1.0
  description: Owner-scoped read-only compatibility contract for feature 004.
paths:
  /api/applications:
    get:
      operationId: listApplications
      summary: List the authenticated owner's applications
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApplicationStatus" }
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApplicationType" }
          style: form
          explode: true
        - name: stage
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/RecruitmentStage" }
          style: form
          explode: true
        - name: city
          in: query
          schema:
            type: array
            items: { type: string, maxLength: 100 }
          style: form
          explode: true
        - { name: appliedFrom, in: query, schema: { type: string, format: date } }
        - { name: appliedTo, in: query, schema: { type: string, format: date } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [company, position, appliedDate, latestDate]
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Owner-scoped application page
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/applications/{id}:
    get:
      operationId: getApplication
      summary: Return one application owned by the authenticated user
      security:
        - signedIdentityBridge: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-scoped application detail
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    signedIdentityBridge:
      type: apiKey
      in: header
      name: Authorization
      description: Internal-only request-bound signed identity assertion from feature 003.
  responses:
    InvalidRequest:
      description: Invalid path or cursor input
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No trusted authenticated owner
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Application is missing or not owned by the authenticated user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Required storage or identity dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ApplicationStatus:
      type: string
      enum: [submitted, offer, refused]
    ApplicationType:
      type: string
      enum:
        - summer_internship
        - daily_internship
        - spring_recruitment
        - early_campus_recruitment
        - campus_recruitment
        - social_recruitment
    RecruitmentStage:
      type: string
      enum:
        - screening
        - assessment
        - written_test
        - interview_1
        - interview_2
        - interview_3
        - hr_interview
        - final_interview
    ApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, companyName, positionName, city, jobUrl, appliedDate, type, status, latestDate, stages, needsFollowUp, followUpDays, followUpReason, version]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        city: { type: [string, "null"] }
        jobUrl: { type: [string, "null"] }
        appliedDate: { type: string, format: date }
        type: { $ref: "#/components/schemas/ApplicationType" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        latestDate: { type: string, format: date }
        stages:
          type: array
          items: { $ref: "#/components/schemas/RecruitmentStage" }
        needsFollowUp: { type: boolean }
        followUpDays: { type: integer, minimum: 0 }
        followUpReason: { type: [string, "null"], enum: [timeline, application, null] }
        version: { type: integer, minimum: 1 }
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApplicationSummary" }
        nextCursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    StageOccurrence:
      type: object
      additionalProperties: false
      required: [id, stage, occurredOn]
      properties:
        id: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/RecruitmentStage" }
        occurredOn: { type: string, format: date }
    ApplicationEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurredOn, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        occurredOn: { type: string, format: date }
        before: {}
        after: {}
        createdAt: { type: string }
    ApplicationDetail:
      allOf:
        - { $ref: "#/components/schemas/ApplicationSummary" }
        - type: object
          required: [notes, stageOccurrences, events, createdAt, updatedAt]
          properties:
            notes: { type: [string, "null"] }
            stageOccurrences:
              type: array
              items: { $ref: "#/components/schemas/StageOccurrence" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ApplicationEvent" }
            createdAt: { type: string }
            updatedAt: { type: string }
    Problem:
      type: object
      required: [status, title, detail, code, requestId]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
        code: { type: string }
        requestId: { type: string }
