openapi: 3.0.3
info:
  title: JobTrace Private Data Export Slice
  version: 0.1.0
  description: Read-only compatibility downloads. The current service remains the importer, writer, session and production traffic owner.
servers:
  - url: /
paths:
  /api/exports/applications:
    get:
      operationId: exportApplications
      summary: Download owned application records
      security:
        - signedBridge: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: xlsx
          description: Unknown values follow the current xlsx fallback.
        - name: scope
          in: query
          schema:
            type: string
            enum: [all, filtered, selected]
            default: filtered
          description: Unknown values follow the current filtered fallback.
        - name: id
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
          description: Required when scope is selected; at least one valid ID.
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: stage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: city
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: appliedFrom
          in: query
          schema:
            type: string
            format: date
        - name: appliedTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Owned application download with the established columns and ordering.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidSelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoOwnedExport'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/exports/interviews:
    get:
      operationId: exportInterviews
      summary: Download one or more owned interview reviews
      security:
        - signedBridge: []
      parameters:
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
          description: Duplicate IDs are ignored after first occurrence.
      responses:
        '200':
          description: One owned review as Markdown or multiple owned reviews as ZIP.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            text/markdown:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidSelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoOwnedExport'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    signedBridge:
      type: http
      scheme: bearer
      bearerFormat: short-lived signed JobTraceBridge assertion
      description: Server-to-server assertion consumed once and bound to exact request method, path, and request ID. Not a browser bearer token.
  responses:
    InvalidSelection:
      description: Invalid or missing selection.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid trusted identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoOwnedExport:
      description: No owned result in the requested selection.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Required storage is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
        requestId:
          type: string
        title:
          type: string
        detail:
          type: string
