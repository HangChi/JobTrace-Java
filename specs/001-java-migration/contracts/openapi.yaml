openapi: 3.1.0
info:
  title: JobTrace Migration Foundation API
  version: 0.4.0
  description: Health and verified read-only pilot contracts for the Java migration runtime.
paths:
  /api/exports/applications:
    get:
      operationId: exportPrivateApplications
      summary: Download owned application records as CSV or XLSX
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, filtered, selected], default: filtered } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: xlsx } }
        - { name: id, in: query, explode: true, schema: { type: array, maxItems: 100, items: { type: string, format: uuid } } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: type, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: stage, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: city, in: query, explode: true, schema: { type: array, items: { type: string } } }
        - { name: appliedFrom, in: query, schema: { type: string, format: date } }
        - { name: appliedTo, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Private application download
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { description: Invalid selection }
        "401": { description: No trusted authenticated owner }
        "404": { description: No owned export data }
        "503": { description: Data store unavailable }
        "500": { description: Export encoding unavailable }
  /api/exports/interviews:
    get:
      operationId: exportPrivateInterviews
      summary: Download owned review Markdown or ZIP
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: id, in: query, required: true, explode: true, schema: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } } }
      responses:
        "200":
          description: One owned review as Markdown, multiple as ZIP
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            Content-Disposition:
              schema: { type: string }
          content:
            text/markdown:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        "400": { description: Invalid selection }
        "401": { description: No trusted authenticated owner }
        "404": { description: No owned export data }
        "503": { description: Data store unavailable }
        "500": { description: Export encoding unavailable }
  /api/reminders:
    get:
      operationId: getPrivateReminderSummary
      summary: Read the authenticated owner's private reminder overview
      security:
        - signedIdentityBridge: []
      parameters:
        - name: status
          in: query
          description: Unknown or absent values use the active default.
          schema: { type: string, default: active }
      responses:
        "200":
          description: Owner-scoped reminder groups and current email availability
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSummary" }
        "401": { description: No trusted authenticated owner }
        "503": { description: Data store unavailable }
  /api/reminder-settings:
    get:
      operationId: getPrivateReminderPreferences
      summary: Read the authenticated owner's reminder defaults
      security:
        - signedIdentityBridge: []
      responses:
        "200":
          description: Owner-scoped reminder preferences
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
        "401": { description: No trusted authenticated owner }
        "503": { description: Data store unavailable }
  /api/interviews:
    get:
      operationId: listPrivateInterviews
      summary: List the authenticated owner's private interview reviews
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: applicationId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, explode: true, schema: { type: array, items: { type: string, enum: [draft, pending_review, completed] } } }
        - { name: stage, in: query, explode: true, schema: { type: array, items: { type: string, enum: [assessment, interview_1, interview_2, interview_3, hr_interview, final_interview] } } }
        - { name: result, in: query, explode: true, schema: { type: array, items: { type: string, enum: [pending, passed, failed] } } }
        - { name: publication, in: query, explode: true, schema: { type: array, items: { type: string, enum: [private, anonymous, attributed] } } }
        - { name: interviewedFrom, in: query, schema: { type: string, format: date } }
        - { name: interviewedTo, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Owner-scoped interview review page
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewPage" }
        "400": { description: Invalid filter or cursor }
        "401": { description: No trusted authenticated owner }
        "503": { description: Data store unavailable }
  /api/interviews/{id}:
    get:
      operationId: getPrivateInterview
      summary: Return an owned private interview review
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Complete owner-scoped review
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewDetail" }
        "400": { description: Invalid identifier }
        "401": { description: No trusted authenticated owner }
        "404": { description: Review missing or owned by another user }
        "503": { description: Data store unavailable }
  /api/applications/{id}/detail:
    get:
      operationId: getApplicationDialogData
      summary: Return owned application detail with interview summaries
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Application dialog data
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDialogData" }
        "400": { description: Invalid identifier }
        "401": { description: No trusted authenticated owner }
        "404": { description: Application missing or owned by another user }
        "503": { description: Data store unavailable }
  /api/applications:
    get:
      operationId: listApplications
      summary: List the authenticated owner's applications
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: array, items: { type: string } }, explode: true }
        - { name: type, in: query, schema: { type: array, items: { type: string } }, explode: true }
        - { name: stage, in: query, schema: { type: array, items: { type: string } }, explode: true }
        - { name: city, in: query, schema: { type: array, items: { type: string } }, explode: true }
        - { name: appliedFrom, in: query, schema: { type: string, format: date } }
        - { name: appliedTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [company, position, appliedDate, latestDate] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Owner-scoped application page
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPage" }
        "400": { description: Invalid query input }
        "401": { description: No trusted authenticated owner }
        "503": { description: Data store unavailable }
  /api/applications/{id}:
    get:
      operationId: getApplication
      summary: Return one owned application's core detail and history
      security:
        - signedIdentityBridge: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Owner-scoped application detail
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { description: Invalid application identifier }
        "401": { description: No trusted authenticated owner }
        "404": { description: Application absent or owned by another user }
        "503": { description: Data store unavailable }
  /api/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      summary: Return the authenticated owner's application analytics summary
      description: >-
        Verified read-only migration pilot. Production activation remains gated on an
        approved signed identity bridge; public identity headers are never authoritative.
      security:
        - signedIdentityBridge: []
      responses:
        "200":
          description: Owner-isolated analytics summary
          headers:
            Cache-Control:
              description: Prevent storage of an owner's analytics response
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          description: No trusted authenticated owner is available
  /api/health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the application process can respond
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the application can query PostgreSQL
      security: []
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          description: The readiness check completed but did not return the expected result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: PostgreSQL or the application dependency is unavailable
components:
  securitySchemes:
    signedIdentityBridge:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Internal-only `JobTraceBridge <compact-JWS>` assertion defined by signed identity
        bridge contract v1. Browser credentials and public identity headers are not accepted.
  schemas:
    Reminder:
      type: object
      additionalProperties: false
      required: [id, applicationId, sourceStageOccurrenceId, companyName, positionName, title, eventAt, notifyAt, emailEnabled, status, version, emailStatus, completedAt, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        sourceStageOccurrenceId: { type: [string, "null"], format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        title: { type: string }
        eventAt: { type: string, format: date-time }
        notifyAt: { type: string, format: date-time }
        emailEnabled: { type: boolean }
        status: { type: string, enum: [pending, due, completed, cancelled] }
        version: { type: integer, minimum: 1 }
        emailStatus: { type: [string, "null"], enum: [claimed, sent, failed, skipped, null] }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
    ReminderEmailAvailability:
      type: object
      additionalProperties: false
      required: [available, address]
      properties:
        available: { type: boolean }
        address: { type: [string, "null"], format: email }
    ReminderSummary:
      type: object
      additionalProperties: false
      required: [overdue, upcoming, history, email]
      properties:
        overdue: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Reminder" } }
        upcoming: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Reminder" } }
        history: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Reminder" } }
        email: { $ref: "#/components/schemas/ReminderEmailAvailability" }
    ReminderPreferences:
      type: object
      additionalProperties: false
      required: [homeEnabled, homeView, defaultLead, defaultSnoozeMinutes, emailDefault]
      properties:
        homeEnabled: { type: boolean }
        homeView: { type: string, enum: [scheduled, suggestions] }
        defaultLead: { type: string, enum: [on_time, 30m, 1h, 1d] }
        defaultSnoozeMinutes: { type: integer, enum: [30, 60, 1440] }
        emailDefault: { type: boolean }
    InterviewSummary:
      type: object
      additionalProperties: false
      required: [id, applicationId, stageOccurrenceId, companyName, positionName, stage, interviewedOn, status, roundResult, linked, questionCount, actionCount, visibility, authorMode, publishedAt]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        stageOccurrenceId: { type: [string, "null"], format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        stage: { type: string, enum: [assessment, interview_1, interview_2, interview_3, hr_interview, final_interview] }
        interviewedOn: { type: string, format: date }
        status: { type: string, enum: [draft, pending_review, completed] }
        roundResult: { type: string, enum: [pending, passed, failed] }
        linked: { type: boolean }
        questionCount: { type: integer, minimum: 0 }
        actionCount: { type: integer, minimum: 0 }
        visibility: { type: string, enum: [private, public] }
        authorMode: { type: string, enum: [anonymous, attributed] }
        publishedAt: { type: [string, "null"] }
    InterviewPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, total, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InterviewSummary" } }
        nextCursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    InterviewQuestion:
      type: object
      required: [id, category, question, originalAnswer, followUpNotes, improvedAnswer, selfRating]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [technical, project, behavioral, system_design, other] }
        question: { type: string }
        originalAnswer: { type: [string, "null"] }
        followUpNotes: { type: [string, "null"] }
        improvedAnswer: { type: [string, "null"] }
        selfRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
    InterviewActionItem:
      type: object
      required: [id, content, completed]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        completed: { type: boolean }
    InterviewDetail:
      allOf:
        - { $ref: "#/components/schemas/InterviewSummary" }
        - type: object
          required: [format, durationMinutes, interviewerNotes, highlights, gaps, version, questions, actionItems, createdAt, updatedAt]
          properties:
            format: { type: [string, "null"], enum: [online, offline, phone, null] }
            durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 600 }
            interviewerNotes: { type: [string, "null"] }
            highlights: { type: [string, "null"] }
            gaps: { type: [string, "null"] }
            version: { type: integer, minimum: 1 }
            questions: { type: array, items: { $ref: "#/components/schemas/InterviewQuestion" } }
            actionItems: { type: array, items: { $ref: "#/components/schemas/InterviewActionItem" } }
            createdAt: { type: string }
            updatedAt: { type: string }
    StageInterviewSummary:
      type: object
      required: [id, stage, interviewedOn, status, questionCount, stageOccurrenceId]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [assessment, interview_1, interview_2, interview_3, hr_interview, final_interview] }
        interviewedOn: { type: string, format: date }
        status: { type: string, enum: [draft, pending_review, completed] }
        questionCount: { type: integer, minimum: 0 }
        stageOccurrenceId: { type: [string, "null"], format: uuid }
    ApplicationDialogData:
      type: object
      additionalProperties: false
      required: [application, interviews]
      properties:
        application: { $ref: "#/components/schemas/ApplicationDetail" }
        interviews: { type: array, items: { $ref: "#/components/schemas/StageInterviewSummary" } }
    ApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, companyName, positionName, city, jobUrl, appliedDate, type, status, latestDate, stages, needsFollowUp, followUpDays, followUpReason, version]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        positionName: { type: string }
        city: { type: [string, "null"] }
        jobUrl: { type: [string, "null"] }
        appliedDate: { type: string, format: date }
        type: { type: string, enum: [summer_internship, daily_internship, spring_recruitment, early_campus_recruitment, campus_recruitment, social_recruitment] }
        status: { type: string, enum: [submitted, offer, refused] }
        latestDate: { type: string, format: date }
        stages:
          type: array
          items: { type: string, enum: [screening, assessment, written_test, interview_1, interview_2, interview_3, hr_interview, final_interview] }
        needsFollowUp: { type: boolean }
        followUpDays: { type: integer, minimum: 0 }
        followUpReason: { type: [string, "null"], enum: [timeline, application, null] }
        version: { type: integer, minimum: 1 }
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, total, page, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApplicationSummary" } }
        nextCursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    ApplicationDetail:
      allOf:
        - { $ref: "#/components/schemas/ApplicationSummary" }
        - type: object
          required: [notes, stageOccurrences, events, createdAt, updatedAt]
          properties:
            notes: { type: [string, "null"] }
            stageOccurrences:
              type: array
              items: { $ref: "#/components/schemas/ApplicationStageOccurrence" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ApplicationEvent" }
            createdAt: { type: string }
            updatedAt: { type: string }
    ApplicationStageOccurrence:
      type: object
      required: [id, stage, occurredOn]
      properties:
        id: { type: string, format: uuid }
        stage: { type: string }
        occurredOn: { type: string, format: date }
    ApplicationEvent:
      type: object
      required: [id, type, occurredOn, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        occurredOn: { type: string, format: date }
        before: {}
        after: {}
        createdAt: { type: string }
    AnalyticsSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - submitted
        - refused
        - offers
        - addedThisWeek
        - stageDistribution
        - followUps
        - progressReminders
      properties:
        total:
          type: integer
          minimum: 0
        submitted:
          type: integer
          minimum: 0
        refused:
          type: integer
          minimum: 0
        offers:
          type: integer
          minimum: 0
        addedThisWeek:
          type: integer
          minimum: 0
        stageDistribution:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/FollowUp"
        progressReminders:
          type: array
          items:
            $ref: "#/components/schemas/ProgressReminder"
    FollowUp:
      type: object
      additionalProperties: false
      required:
        - id
        - companyName
        - positionName
        - city
        - jobUrl
        - appliedDate
        - type
        - status
        - latestDate
        - stages
        - needsFollowUp
        - followUpDays
        - followUpReason
        - version
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        positionName:
          type: string
        city:
          type:
            - string
            - "null"
        jobUrl:
          type:
            - string
            - "null"
          format: uri
        appliedDate:
          type: string
          format: date
        type:
          type: string
        status:
          type: string
        latestDate:
          type: string
          format: date
        stages:
          type: array
          items:
            type: string
        needsFollowUp:
          type: boolean
        followUpDays:
          type: integer
          minimum: 0
        followUpReason:
          type: string
          enum:
            - timeline
            - application
        version:
          type: integer
          minimum: 0
    ProgressReminder:
      type: object
      additionalProperties: false
      required:
        - id
        - applicationId
        - companyName
        - positionName
        - city
        - stageOccurrenceId
        - stage
        - occurredOn
        - reviewId
        - reviewStatus
        - completed
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        companyName:
          type: string
        positionName:
          type: string
        city:
          type:
            - string
            - "null"
        stageOccurrenceId:
          type: string
          format: uuid
        stage:
          type: string
        occurredOn:
          type: string
          format: date
        reviewId:
          type:
            - string
            - "null"
          format: uuid
        reviewStatus:
          type:
            - string
            - "null"
        completed:
          type: boolean
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - error
