services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtrace
      POSTGRES_USER: jobtrace
      POSTGRES_PASSWORD: jobtrace
    ports:
      - "127.0.0.1:${JOBTRACE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrace -d jobtrace"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - jobtrace-postgres-data:/var/lib/postgresql/data

volumes:
  jobtrace-postgres-data:

