spring:
  application:
    name: jobtrace
  datasource:
    url: ${jobtrace.database.url}
    username: ${jobtrace.database.username}
    password: ${jobtrace.database.password}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        connectTimeout: "5"
        socketTimeout: "5"
  flyway:
    enabled: ${jobtrace.migration.flyway-enabled}
  jooq:
    sql-dialect: POSTGRES

jobtrace:
  database:
    url: ${JOBTRACE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/jobtrace}
    username: ${JOBTRACE_DATABASE_USERNAME:jobtrace}
    password: ${JOBTRACE_DATABASE_PASSWORD:jobtrace}
  migration:
    flyway-enabled: ${JOBTRACE_FLYWAY_ENABLED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: never
  forward-headers-strategy: framework
